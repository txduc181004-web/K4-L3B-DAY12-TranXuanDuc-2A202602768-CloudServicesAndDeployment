name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # CP5 gọi vào bản deploy đang sống, bonus kiểm tra chính badge này
      # → không chạy trong CI. Test build Docker để cho job `build`.
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: docker build
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Image size & build checks (test_cp2 -m docker)
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: |
          docker images day12-agent
          pytest tests/test_cp2.py -v -m docker

      - name: Container smoke test
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/ask \
            -H 'Content-Type: application/json' -d '{"question":"hi"}')" = "401"
          docker rm -f agent

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip notice (chưa cấu hình secret)
        if: env.RAILWAY_TOKEN == ''
        run: echo "::warning::RAILWAY_TOKEN chưa được đặt trong GitHub Secrets — bỏ qua bước deploy."

      - uses: actions/setup-node@v4
        if: env.RAILWAY_TOKEN != ''
        with:
          node-version: "20"

      - name: Deploy (railway up)
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway up --ci --service "$RAILWAY_SERVICE"

      - name: Smoke test
        if: env.RAILWAY_TOKEN != '' && env.PUBLIC_URL != ''
        run: |
          sleep 45
          curl -fsS "$PUBLIC_URL/health"
          curl -fsS "$PUBLIC_URL/ready"
